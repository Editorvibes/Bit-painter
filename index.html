<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bit Screen</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #111;
    color: #fff;
    font-family: sans-serif;
    margin: 0;
    min-height: 100vh;
    justify-content: flex-start;
    padding-top: 10px;
  }
  canvas {
    border: 2px solid #fff;
    image-rendering: pixelated;
    max-width: 95vw;
    max-height: 70vh;
    margin-bottom: 20px;
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 95vw;
    max-width: 600px;
  }
  label {
    margin-bottom: 5px;
  }
  input[type="range"] {
    width: 100%;
  }
  input[type="file"], button {
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
    background-color: #222;
    color: #fff;
    border: 1px solid #fff;
    border-radius: 4px;
  }
  input[type="file"]:hover, button:hover {
    background-color: #444;
  }
</style>
</head>
<body>

<canvas id="bitScreen" width="1000" height="1000"></canvas>

<div class="controls">
  <label for="bitSlider">Bits per row/column: <span id="bitCount">1000</span></label>
  <input type="range" id="bitSlider" min="10" max="1000" value="1000">
  <input type="file" id="imageUpload" accept="image/*">
  <button id="randomizeBtn">Randomize Colors</button>
</div>

<script>
const canvas = document.getElementById('bitScreen');
const ctx = canvas.getContext('2d');
const width = canvas.width;
const height = canvas.height;

let bitCount = 1000; // default resolution
let currentImage = null;

// Update bit count from slider
const bitSlider = document.getElementById('bitSlider');
const bitLabel = document.getElementById('bitCount');
bitSlider.addEventListener('input', () => {
  bitCount = parseInt(bitSlider.value);
  bitLabel.textContent = bitCount;
  if (currentImage) {
    drawImageBits(currentImage);
  } else {
    drawRandomBits();
  }
});

// Draw random colored bits
function drawRandomBits() {
  const blockSize = width / bitCount;
  for (let y = 0; y < bitCount; y++) {
    for (let x = 0; x < bitCount; x++) {
      ctx.fillStyle = `rgb(${Math.floor(Math.random()*256)},${Math.floor(Math.random()*256)},${Math.floor(Math.random()*256)})`;
      ctx.fillRect(x * blockSize, y * blockSize, blockSize, blockSize);
    }
  }
}

// Draw an image resampled to the bit resolution
function drawImageBits(img) {
  const blockSize = width / bitCount;
  
  // Draw the image to a temporary offscreen canvas at bitCount x bitCount
  const offCanvas = document.createElement('canvas');
  offCanvas.width = bitCount;
  offCanvas.height = bitCount;
  const offCtx = offCanvas.getContext('2d');
  offCtx.drawImage(img, 0, 0, bitCount, bitCount);
  
  const imageData = offCtx.getImageData(0, 0, bitCount, bitCount).data;
  
  // Draw each “bit” as a block on the main canvas
  for (let y = 0; y < bitCount; y++) {
    for (let x = 0; x < bitCount; x++) {
      const i = (y * bitCount + x) * 4;
      const r = imageData[i];
      const g = imageData[i + 1];
      const b = imageData[i + 2];
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x * blockSize, y * blockSize, blockSize, blockSize);
    }
  }
}

// Upload image
document.getElementById('imageUpload').addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    currentImage = img;
    drawImageBits(img);
  };
  img.src = URL.createObjectURL(file);
});

document.getElementById('randomizeBtn').addEventListener('click', () => {
  currentImage = null;
  drawRandomBits();
});

// Initialize
drawRandomBits();
</script>

</body>
</html>
